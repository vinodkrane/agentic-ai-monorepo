name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: ruff check app evals tests scripts
      - run: pytest -m "not llm"

  # nightly-eval.yml runs the retrieval + llm evals against the dev index
  # with an assumed role, they need bedrock and opensearch access
