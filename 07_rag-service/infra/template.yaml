AWSTemplateFormatVersion: "2010-09-09"
Description: kb-rag-service ingestion (S3 -> SQS -> EC2 workers -> OpenSearch) + doc status table

# The OpenSearch domain, VPC and the API (ECS service) are owned by the
# platform stack, we take what we need in as parameters.

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, test, live]
  OpenSearchHost:
    Type: String
    Description: domain endpoint without https://
  OpenSearchDomainArn:
    Type: String
  WorkerImage:
    Type: String
    Description: full ECR image uri incl. tag, e.g. 123456789012.dkr.ecr.eu-west-2.amazonaws.com/kb-rag-worker:abc123
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: private subnets with a route to S3/SQS/Bedrock/OpenSearch (NAT or VPC endpoints)
  WorkerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: needs outbound 443 only, and must be allowed by the OpenSearch domain SG
  InstanceType:
    Type: String
    Default: t3.medium
  MinWorkers:
    Type: Number
    Default: 1
  MaxWorkers:
    Type: Number
    # bedrock titan starts throttling us above ~5 concurrent embedders
    Default: 5
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

  # ---------- storage + queue ----------

  DocsBucket:
    Type: AWS::S3::Bucket
    DependsOn: IngestQueuePolicy
    Properties:
      BucketName: !Sub kb-rag-docs-${Env}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt IngestQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  IngestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub kb-rag-ingest-dlq-${Env}
      MessageRetentionPeriod: 1209600  # 14 days

  IngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub kb-rag-ingest-${Env}
      # the worker extends this with a heartbeat while it works on a doc,
      # so it only needs to cover the gap between heartbeats + a killed worker
      VisibilityTimeout: 300
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestDLQ.Arn
        maxReceiveCount: 3  # keep in sync with MAX_RECEIVE_COUNT below

  IngestQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref IngestQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt IngestQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:aws:s3:::kb-rag-docs-${Env}

  # one row per uploaded doc, backs GET /documents/{doc_id}
  DocStatusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub kb-rag-doc-status-${Env}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: doc_id
          AttributeType: S
      KeySchema:
        - AttributeName: doc_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # attached to the API's ECS task role by the platform stack
  ApiAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub kb-rag-api-access-${Env}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:PutObject
            Resource: !Sub arn:aws:s3:::kb-rag-docs-${Env}/uploads/*
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
            Resource: !GetAtt DocStatusTable.Arn

  # ---------- worker fleet ----------

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /kb-rag/ingest-worker-${Env}
      RetentionInDays: 30

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub kb-rag-ingest-worker-${Env}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # SSM session manager instead of SSH, and ECR pull
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: ingest
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !GetAtt IngestQueue.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::kb-rag-docs-${Env}/uploads/*
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
              - Effect: Allow
                Action: [es:ESHttpGet, es:ESHttpPost, es:ESHttpPut, es:ESHttpHead]
                Resource: !Sub ${OpenSearchDomainArn}/*
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt DocStatusTable.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${WorkerLogGroup.Arn}:*

  WorkerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkerRole]

  WorkerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub kb-rag-ingest-worker-${Env}
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt WorkerInstanceProfile.Arn
        SecurityGroupIds: [!Ref WorkerSecurityGroupId]
        MetadataOptions:
          HttpTokens: required  # IMDSv2 only
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub kb-rag-ingest-worker-${Env}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            dnf install -y docker
            systemctl enable --now docker

            REGISTRY=$(echo "${WorkerImage}" | cut -d/ -f1)
            aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin $REGISTRY
            docker pull ${WorkerImage}

            # --restart always: if the worker crashes docker brings it back
            # --stop-timeout: give the current doc time to finish on shutdown
            docker run -d --name ingest-worker --restart always --stop-timeout 300 \
              --log-driver awslogs \
              --log-opt awslogs-region=${AWS::Region} \
              --log-opt awslogs-group=${WorkerLogGroup} \
              --log-opt awslogs-stream=$(ec2-metadata -i | cut -d' ' -f2) \
              -e AWS_REGION=${AWS::Region} \
              -e DOCS_BUCKET=kb-rag-docs-${Env} \
              -e INGEST_QUEUE_URL=${IngestQueue} \
              -e STATUS_TABLE=${DocStatusTable} \
              -e MAX_RECEIVE_COUNT=3 \
              -e VISIBILITY_TIMEOUT=300 \
              -e HEARTBEAT_SECONDS=60 \
              -e OPENSEARCH_HOST=${OpenSearchHost} \
              -e OPENSEARCH_PORT=443 \
              -e OPENSEARCH_USE_IAM=true \
              -e INDEX_NAME=kb-chunks-v1 \
              ${WorkerImage}

  WorkerAsg:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub kb-rag-ingest-worker-${Env}
      VPCZoneIdentifier: !Ref SubnetIds
      MinSize: !Ref MinWorkers
      MaxSize: !Ref MaxWorkers
      DesiredCapacity: !Ref MinWorkers
      HealthCheckType: EC2
      LaunchTemplate:
        LaunchTemplateId: !Ref WorkerLaunchTemplate
        Version: !GetAtt WorkerLaunchTemplate.LatestVersionNumber
    UpdatePolicy:
      # new image tag -> new launch template version -> replace instances one by one
      AutoScalingRollingUpdate:
        MinInstancesInService: 0
        MaxBatchSize: 1
        PauseTime: PT2M

  # scale on queue depth. step scaling, simple and good enough for our volume
  ScaleOutPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref WorkerAsg
      PolicyType: StepScaling
      AdjustmentType: ChangeInCapacity
      EstimatedInstanceWarmup: 120
      StepAdjustments:
        - MetricIntervalLowerBound: 0
          MetricIntervalUpperBound: 50
          ScalingAdjustment: 1
        - MetricIntervalLowerBound: 50
          ScalingAdjustment: 2

  ScaleInPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref WorkerAsg
      PolicyType: StepScaling
      AdjustmentType: ChangeInCapacity
      StepAdjustments:
        - MetricIntervalUpperBound: 0
          ScalingAdjustment: -1

  QueueBacklogHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kb-rag-ingest-backlog-high-${Env}
      AlarmDescription: scale out workers
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref ScaleOutPolicy]

  QueueEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kb-rag-ingest-queue-empty-${Env}
      AlarmDescription: scale in workers after 15 min with nothing waiting and nothing in flight
      # in-flight counts too, otherwise we scale in while a worker is mid document
      Metrics:
        - Id: visible
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions:
                - Name: QueueName
                  Value: !GetAtt IngestQueue.QueueName
            Period: 300
            Stat: Maximum
        - Id: inflight
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesNotVisible
              Dimensions:
                - Name: QueueName
                  Value: !GetAtt IngestQueue.QueueName
            Period: 300
            Stat: Maximum
        - Id: total
          Expression: visible + inflight
          ReturnData: true
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: LessThanOrEqualToThreshold
      AlarmActions: [!Ref ScaleInPolicy]

  # ---------- alerts ----------

  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kb-rag-ingest-dlq-not-empty-${Env}
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

  # nothing is draining the queue - workers down, can't pull the image, etc.
  OldestMessageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kb-rag-ingest-queue-stale-${Env}
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1800  # 30 min
      ComparisonOperator: GreaterThanThreshold

Outputs:
  BucketName:
    Value: !Ref DocsBucket
  QueueUrl:
    Value: !Ref IngestQueue
  StatusTableName:
    Value: !Ref DocStatusTable
  WorkerAsgName:
    Value: !Ref WorkerAsg
  ApiAccessPolicyArn:
    Description: attach to the API task role
    Value: !Ref ApiAccessPolicy
