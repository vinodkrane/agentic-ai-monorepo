[pytest]
testpaths = tests
pythonpath = .
markers =
    live: calls the real OpenAI API (costs money, needs OPENAI_API_KEY)
# live tests are skipped by default. Run them with: pytest -m live
addopts = -m "not live"

filterwarnings =
    ignore:langsmith.wrappers._openai_agents is deprecated:DeprecationWarning
